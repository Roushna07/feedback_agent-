[theme]
primaryColor = "#0D9488"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
base = "light"

[server]
headless = true
address = "0.0.0.0"
# Set both certificate paths to enable HTTPS for mobile microphone access.
sslCertFile = "C:/Users/roush/AppData/Local/Village360/certs/server.crt"
sslKeyFile = "C:/Users/roush/AppData/Local/Village360/certs/server.key"
enableCORS = false
enableXsrfProtection = false
